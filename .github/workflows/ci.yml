name: CI

on:
  push:
  pull_request:

# Runner and approval-policy tests run on Node 20/22; TypeScript-import suites
# run on Node 22 with type stripping. Hook tests import
# claude-code/testing, which ships with Claude Code, so `claude plugin test .`
# and `claude plugin validate --strict .` run locally.
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: node --check scripts/codex-runner.mjs
      - name: Runner and approval-policy tests
        run: node --test tests/runner.test.mjs tests/approval-policy.test.mjs
      - name: Cache, checkpoint, execution-policy, and status projection tests
        if: matrix.node == 22
        run: node --experimental-strip-types --test tests/store-state.test.mjs tests/row-cache.test.mjs tests/execution-policy.test.mjs tests/agent-status.test.mjs
      - name: JSON validity
        run: |
          node -e "
          const fs = require('fs');
          const files = [...fs.readdirSync('.claude-plugin').filter(f => f.endsWith('.json')).map(f => '.claude-plugin/' + f), 'hooks/hooks.json'];
          for (const f of files) { JSON.parse(fs.readFileSync(f, 'utf8')); console.log('ok', f); }
          "
